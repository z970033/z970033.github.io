<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌴 2026 宮古島行程</title>
    <style>
        :root {
            --bg: #f8f4ee;
            --card: #fdfbf8;
            --brown: #7a5640;
            --ink: #3b2a20;
            --mut: #8a7667;
            --bd: #e7ddd2;
            --sand: #eadfd3
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "Noto Sans TC", sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.55;
            padding: 28px 18px 60px;
            max-width: 820px;
            margin: 0 auto
        }

        .header {
            margin-bottom: 26px;
            padding: 0 4px
        }

        .eyebrow {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .22em;
            color: var(--brown);
            margin-bottom: 10px
        }

        .header h1 {
            font-size: 32px;
            font-weight: 800;
            line-height: 1.25;
            color: var(--ink);
            margin-bottom: 10px
        }

        .header p {
            font-size: 15px;
            color: var(--mut)
        }

        .day {
            background: var(--card);
            padding: 18px;
            border-radius: 26px;
            border: 1px solid var(--bd);
            box-shadow: 0 8px 24px rgba(90, 60, 40, .07);
            margin-bottom: 22px
        }

        .day-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            background: var(--brown);
            color: #fff;
            padding: 12px 18px;
            border-radius: 999px;
            font-weight: 700;
            margin-bottom: 16px
        }

        .day-title small {
            font-weight: 500;
            font-size: 12px;
            background: rgba(255, 255, 255, .18);
            padding: 3px 10px;
            border-radius: 999px
        }

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-left: 16px;
            border-left: 3px solid var(--sand)
        }

        .item {
            background: #fff;
            border: 1px solid var(--bd);
            border-radius: 18px;
            padding: 12px 16px;
            position: relative
        }

        .item::before {
            content: '';
            position: absolute;
            left: -25px;
            top: 18px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--brown);
            border: 2px solid var(--bg)
        }

        .tag {
            display: inline-block;
            padding: 2px 10px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 999px;
            margin-right: 6px;
            background: var(--sand);
            color: var(--brown)
        }

        .t-flight {
            background: #e6ecef;
            color: #44606e
        }

        .t-hotel {
            background: #f3e6cf;
            color: #8a5a1c
        }

        .t-food {
            background: #f4dcd4;
            color: #9a4630
        }

        .t-shop {
            background: #ebdfe8;
            color: #76506c
        }

        .t-spot {
            background: #dfe8d6;
            color: #4f6b3a
        }

        .t-act {
            background: #e4dcec;
            color: #5f4a7a
        }

        a.name {
            color: var(--ink);
            font-weight: 700;
            text-decoration: none
        }

        a.name:hover {
            color: var(--brown);
            text-decoration: underline
        }

        .map {
            text-decoration: none;
            margin-left: 6px;
            font-size: 13px
        }

        .time {
            font-size: 12px;
            color: var(--mut);
            margin-top: 4px
        }

        .note {
            font-size: 12px;
            color: #b4533a;
            font-weight: 600;
            margin-top: 4px
        }

        @media(max-width:600px) {
            body {
                padding: 20px 12px 50px
            }

            .day {
                padding: 14px;
                border-radius: 22px
            }

            .header h1 {
                font-size: 26px
            }
        }

        /* ===== 封面 + 列印/PDF：一天一頁 ===== */
        .cover {
            background: var(--card);
            border-radius: 26px;
            overflow: hidden;
            border: 1px solid var(--bd);
            box-shadow: 0 8px 24px rgba(90, 60, 40, .07);
            margin-bottom: 22px;
            padding: 22px 22px 0;
            /* 網頁版：讓圖片上方與左右留空 */
        }

        .cover img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;
            background: var(--card);
            border-radius: 18px;
            /* 搭配外框的圓角 */
        }

        .cover-text {
            padding: 24px 6px 30px
        }

        .cover-text .eyebrow {
            margin-bottom: 12px
        }

        .cover-text h1 {
            font-size: 34px;
            font-weight: 800;
            line-height: 1.25;
            margin-bottom: 12px
        }

        .cover-text p {
            font-size: 15px;
            color: var(--mut)
        }

        @page {
            size: A4;
            margin: 0
        }

        @media print {
            * {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact
            }

            body {
                max-width: none;
                padding: 0;
                background: var(--bg)
            }

            .header {
                display: none
            }

            .cover,
            .day {
                width: 210mm;
                height: 297mm;
                margin: 0;
                border: none;
                border-radius: 0;
                box-shadow: none;
                break-after: page;
                page-break-after: always;
                overflow: hidden
            }

            .cover {
                display: flex;
                flex-direction: column;
                background: var(--card);
                padding: 16mm 16mm 0;
                /* 列印/PDF版：上方與左右留出 16mm 邊距 */
            }

            .cover img {
                flex: 1;
                min-height: 0;
                object-fit: contain;
                border-radius: 16px;
            }

            .cover-text {
                padding: 12mm 2mm 18mm
            }

            .cover-text h1 {
                font-size: 40px
            }

            .day {
                padding: 16mm 15mm;
                background: var(--bg)
            }

            .day-title {
                font-size: 18px;
                padding: 14px 22px;
                margin-bottom: 20px
            }

            .item {
                padding: 12px 18px;
                break-inside: avoid
            }

            .timeline {
                gap: 12px
            }
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <script>
        const TN = { flight: '交通', hotel: '飯店', food: '美食', shop: '購物', spot: '景點', act: '行程' };
        const H1 = '沖繩宮古島希爾頓嘉悅里度假酒店', H2 = 'Apartment 11';
        // [type, name, time, note, customMap]
        const days = [
            {
                t: '第一天 (10/12) 一', h: H1, items: [
                    ['flight', '星宇航空 JX308（07:20 臺中 T2 ✈️ 09:40 下地島）'],

            },

                    ['hotel', H2]]
            },
            {

                    ['hotel', H2],
                    ['spot', '砂山海灘（砂山ビーチ）', '24 小時'],
                    ['food', "HARRY'S Shrimp Truck", '11:00–17:00', '蝦蝦飯'],
                    ['food', '宮古きび茶屋 さとうきび甘味処', '10:00–15:45（六休息）', '手打甘蔗汁，營業至 15:45'],
                    ['food', 'Yukishio Salt Factory（雪鹽博物館）', '09:00–18:00', '雪鹽冰淇淋'],
                    ['food', '海美來 (Kaimiru)', '09:30–18:00', '元祖紅芋餅'],
                    ['food', 'GELATO CAFE NINUFA', '10:00–17:00（三休息）', '📌 從這裡走下去能看到心型岩'],
                    ['hotel', H2]]
            },
            {
                t: '第五天 (10/16) 五', h: H2, items: [
                    ['hotel', H2],
                    ['act', 'Lani 宮古島 SUP 立槳體驗', '09:00 預約', '📌 詳細集合地點依前一天業者通知為主'],
                    ['spot', '與那覇前濱海灘（與那覇前浜ビーチ）', '24 小時'],
                    ['food', '宮古そば まっすぐ', '11:00–16:00', '午餐：宮古麵'],
                    ['spot', 'The Shigira Lift Ocean Sky 纜車', '10:00–17:00', '營業至 17:00'],
                    ['shop', '琉球ザッカ青空 宮古島（來間島）', '10:00–12:00, 13:00–17:00', '買紀念品，營業至 17:00'],
                    ['food', 'Aosora Parlor 冰沙店'],
                    ['food', 'RuLer\'s TACORiCE 宮古アイランド店', '10:00–21:30', '晚餐：塔可飯'],
                    ['hotel', H2]]
            },
            {
                t: '第六天 (10/17) 六', h: H2, items: [
                    ['hotel', H2],
                    ['act', 'UNI BEACH 空拍機寫真與遊船體驗', '約 2 小時', '', 'https://www.google.com/maps/place/24.783689,+125.262804/@24.7837169,125.2627954,20z/data=!4m4!3m3!8m2!3d24.7836887!4d125.2628039'],
                    ['food', 'ensemble coffee miyakoisland', '', '午餐(優格碗)'],
                    ['act', '八重干瀨搭船浮潛體驗', '8:30 / 11:30（2個半小時）'],
                    ['food', 'Restaurant Qui.Town', '19:30 預約', '✅ 已於 Tabelog 預訂（晚餐）'],
                    ['hotel', H2]]
            },
            {
                t: '第七天 (10/18) 日', h: H2, items: [
                    ['hotel', H2],
                    ['food', 'NINGIN COFFEE エンギン珈琲', '09:00–17:00', '早餐'],
                    ['food', '麺屋 サマー太陽', '10:30–14:30（六、三休息）', '午餐：鮮蝦拉麵，營業至 14:30'],
                    ['shop', '1 LAB Hello, VACAY宮古島', '11:00–17:00', '選物店買伴手禮，營業至 17:00'],
                    ['food', 'さとうきびの店ぶーずやー', '12:00–18:00（一休息）', '黑糖拿鐵，營業至 18:00'],
                    ['shop', 'Hakoniwa KURIMA', '10:00–18:00（一到五休息）', '買宮古島T恤'],
                    ['food', '宮古牛焼肉 玉城', '17:00 預約', '✅ 已於 Tabelog 預訂'],
                    ['hotel', H2]]
            },
            {
                t: '第八天 (10/19) 一', h: '返程', items: [
                    ['hotel', H2 + ' 退房'],
                    ['flight', '星宇航空 JX309（10:40 下地島 ✈️ 11:00 臺中 T2）'],
                    ['flight', '平安抵達臺中國際機場']]
            }
        ];
        const q = s => encodeURIComponent(s);
        document.getElementById('app').innerHTML = `<div class="cover"><img src="https://z970033.github.io/travel/miyakojima/2026/S__33800197.jpg" alt="2026 宮古島封面"><div class="cover-text"><div class="eyebrow">2026 宮古島 ・ 10/12 – 10/19</div><h1>17 の 8 天 7 夜宮古島之旅</h1></div></div>` + days.map(d => `
<div class="day"><div class="day-title"><span>${d.t}</span><small>${d.h}</small></div>
<div class="timeline">${d.items.map(([ty, n, tm, nt, cm]) => `
<div class="item"><span class="tag t-${ty}">${TN[ty]}</span>
<a class="name" href="https://www.google.com/search?q=${q(n)}" target="_blank" rel="noopener">${n}</a>
<a class="map" href="${cm || 'https://www.google.com/maps/search/?api=1&query=' + q(n)}" target="_blank" rel="noopener" title="Google 地圖">🗺</a>
${tm ? `<div class="time">🕒 ${tm}</div>` : ''}${nt ? `<div class="note">${nt.startsWith('📌') || nt.startsWith('⚠️') || nt.startsWith('✅') ? '' : '📌 '}${nt}</div>` : ''}</div>`).join('')}
</div></div>`).join('');
    </script>
</body>

</html>
