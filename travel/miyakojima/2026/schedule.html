<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌴 2026 宮古島行程</title>
    <style>
        :root {
            --bg: #f8f4ee;
            --card: #fdfbf8;
            --brown: #7a5640;
            --ink: #3b2a20;
            --mut: #8a7667;
            --bd: #e7ddd2;
            --sand: #eadfd3
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "Noto Sans TC", sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.55;
            padding: 28px 18px 60px;
            max-width: 820px;
            margin: 0 auto
        }

        .header {
            margin-bottom: 26px;
            padding: 0 4px
        }

        .eyebrow {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .22em;
            color: var(--brown);
            margin-bottom: 10px
        }

        .header h1 {
            font-size: 32px;
            font-weight: 800;
            line-height: 1.25;
            color: var(--ink);
            margin-bottom: 10px
        }

        .header p {
            font-size: 15px;
            color: var(--mut)
        }

        .day {
            background: var(--card);
            padding: 18px;
            border-radius: 26px;
            border: 1px solid var(--bd);
            box-shadow: 0 8px 24px rgba(90, 60, 40, .07);
            margin-bottom: 22px
        }

        .day-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            background: var(--brown);
            color: #fff;
            padding: 12px 18px;
            border-radius: 999px;
            font-weight: 700;
            margin-bottom: 16px
        }

        .day-title small {
            font-weight: 500;
            font-size: 12px;
            background: rgba(255, 255, 255, .18);
            padding: 3px 10px;
            border-radius: 999px
        }

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-left: 16px;
            border-left: 3px solid var(--sand)
        }

        .item {
            background: #fff;
            border: 1px solid var(--bd);
            border-radius: 18px;
            padding: 12px 16px;
            position: relative
        }

        .item::before {
            content: '';
            position: absolute;
            left: -25px;
            top: 18px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--brown);
            border: 2px solid var(--bg)
        }

        .tag {
            display: inline-block;
            padding: 2px 10px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 999px;
            margin-right: 6px;
            background: var(--sand);
            color: var(--brown)
        }

        .t-flight {
            background: #e6ecef;
            color: #44606e
        }

        .t-hotel {
            background: #f3e6cf;
            color: #8a5a1c
        }

        .t-food {
            background: #f4dcd4;
            color: #9a4630
        }

        .t-shop {
            background: #ebdfe8;
            color: #76506c
        }

        .t-spot {
            background: #dfe8d6;
            color: #4f6b3a
        }

        .t-act {
            background: #e4dcec;
            color: #5f4a7a
        }

        a.name {
            color: var(--ink);
            font-weight: 700;
            text-decoration: none
        }

        a.name:hover {
            color: var(--brown);
            text-decoration: underline
        }

        .map {
            text-decoration: none;
            margin-left: 6px;
            font-size: 13px
        }

        .time {
            font-size: 12px;
            color: var(--mut);
            margin-top: 4px
        }

        .note {
            font-size: 12px;
            color: #b4533a;
            font-weight: 600;
            margin-top: 4px
        }

        @media(max-width:600px) {
            body {
                padding: 16px 10px 50px
            }

            .day {
                padding: 14px;
                border-radius: 22px
            }

            .header h1 {
                font-size: 26px
            }
        }

        /* ===== 封面 + 列印/PDF：一天一頁 ===== */
        .cover {
            background: var(--card);
            border-radius: 26px;
            overflow: hidden;
            border: 1px solid var(--bd);
            box-shadow: 0 8px 24px rgba(90, 60, 40, .07);
            margin-bottom: 22px;
            padding-top: 20px;
            /* 確保上方有呼吸空間 */
        }

        .cover img {
            display: block;
            width: calc(100% - 32px);
            /* 左右兩側完美留白 */
            margin: 0 auto;
            height: auto;
            object-fit: contain;
            border-radius: 16px;
            background: #fdfbf8;
        }

        .cover-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            padding: 22px 26px 16px;
            gap: 16px;
        }

        .cover-text .eyebrow {
            margin-bottom: 8px
        }

        .cover-text h1 {
            font-size: 32px;
            font-weight: 800;
            line-height: 1.25;
            margin-bottom: 0
        }

        /* 社群按鈕群組 */
        .social-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .social-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: white;
            padding: 9px 15px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            white-space: nowrap;
            transition: opacity 0.2s, transform 0.1s;
        }

        .social-btn:hover {
            opacity: 0.9;
        }

        .social-btn svg {
            width: 17px;
            height: 17px;
            fill: white;
        }

        .line-btn {
            background: #06C755;
            box-shadow: 0 4px 12px rgba(6, 199, 85, 0.25);
        }

        .ig-btn {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            box-shadow: 0 4px 12px rgba(220, 39, 67, 0.25);
        }

        /* ===== e心通 9折推廣橫幅 ===== */
        .esim-wrap {
            padding: 0 26px 26px;
        }

        .esim-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            background: #fff;
            border: 1px solid var(--bd);
            border-radius: 20px;
            padding: 14px 18px;
            text-decoration: none;
            color: var(--ink);
            box-shadow: 0 4px 12px rgba(90, 60, 40, .04);
            transition: transform 0.15s, border-color 0.15s;
        }

        .esim-banner:hover {
            transform: translateY(-2px);
            border-color: var(--brown);
        }

        .esim-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .esim-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--sand);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .esim-icon svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: var(--brown);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .esim-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 4px;
        }

        .esim-brand {
            font-size: 15px;
            font-weight: 800;
            color: var(--ink);
        }

        .esim-badge {
            background: var(--sand);
            color: var(--brown);
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            letter-spacing: 0.02em;
        }

        .esim-sub {
            font-size: 12px;
            color: var(--mut);
            font-weight: 500;
        }

        .esim-code {
            background: var(--bg);
            color: var(--brown);
            font-family: monospace;
            font-weight: 700;
            font-size: 12px;
            padding: 1px 6px;
            border-radius: 4px;
            border: 1px solid var(--bd);
        }

        .esim-cta {
            background: var(--brown);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            padding: 8px 14px;
            border-radius: 999px;
            white-space: nowrap;
            flex-shrink: 0;
            transition: opacity 0.2s;
        }

        .esim-banner:hover .esim-cta {
            opacity: 0.9;
        }

        @media(max-width:600px) {
            .esim-banner {
                flex-direction: column;
                align-items: flex-start;
            }

            .esim-cta {
                width: 100%;
                text-align: center;
            }
        }

        @page {
            size: A4;
            margin: 0
        }

        @media print {
            * {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact
            }

            body {
                max-width: none;
                padding: 0;
                background: var(--bg)
            }

            .header {
                display: none
            }

            .cover,
            .day {
                width: 210mm;
                height: 297mm;
                margin: 0;
                border: none;
                border-radius: 0;
                box-shadow: none;
                break-after: page;
                page-break-after: always;
                overflow: hidden
            }

            .cover {
                display: flex;
                flex-direction: column;
                background: var(--card);
                padding-top: 14mm;
            }

            .cover img {
                flex: 1;
                min-height: 0;
                width: calc(100% - 32mm);
                margin: 0 auto;
                object-fit: contain;
                border-radius: 16px;
            }

            .cover-content {
                padding: 10mm 16mm 6mm;
            }

            .cover-text h1 {
                font-size: 36px
            }

            .esim-wrap {
                padding: 0 16mm 14mm;
            }

            .day {
                padding: 16mm 15mm;
                background: var(--bg)
            }

            .day-title {
                font-size: 18px;
                padding: 14px 22px;
                margin-bottom: 20px
            }

            .item {
                padding: 12px 18px;
                break-inside: avoid
            }

            .timeline {
                gap: 12px
            }
        }
    </style>
</head>
