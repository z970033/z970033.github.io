<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宮古島景點美食與行程指南</title>
    <style>
        :root {
            --primary-color: #008080;
            --secondary-color: #20b2aa;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --accent-border: #e0e0e0;
            --badge-city: #2c3e50;
            --badge-north: #16a085;
            --badge-south: #d35400;
            --badge-irabu: #2980b9;
            --badge-day: #008080;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #008080, #20b2aa);
            color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 128, 128, 0.2);
        }

        .header h1 {
            font-size: 26px;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .tab-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .tab-button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid var(--primary-color);
            background-color: white;
            color: var(--primary-color);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .tab-button.active {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 10px rgba(0, 128, 128, 0.3);
        }

        .tab-button:hover {
            opacity: 0.9;
        }

        .area-section {
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .area-title {
            font-size: 18px;
            font-weight: bold;
            padding: 10px 16px;
            border-radius: 8px;
            color: white;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .area-city {
            background-color: var(--badge-city);
        }

        .area-north {
            background-color: var(--badge-north);
        }

        .area-south {
            background-color: var(--badge-south);
        }

        .area-irabu {
            background-color: var(--badge-irabu);
        }

        .area-day {
            background-color: var(--badge-day);
        }

        .map-placeholder {
            padding: 40px 20px;
            text-align: center;
            background: linear-gradient(180deg, #e0f2fe 0%, #f0f9ff 100%);
            border: 2px dashed #93c5fd;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .map-placeholder h3 {
            color: #1e3a8a;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .map-placeholder p {
            color: #475569;
            font-size: 13px;
            line-height: 1.6;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }

        .spot-card {
            background: var(--card-bg);
            border: 1px solid var(--accent-border);
            border-radius: 10px;
            padding: 14px 16px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .spot-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.08);
        }

        .spot-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
            gap: 8px;
        }

        .spot-name {
            font-size: 15px;
            font-weight: bold;
            color: #2c3e50;
            text-decoration: none;
        }

        .spot-name:hover {
            color: var(--primary-color);
            text-decoration: underline;
        }

        .scheduled-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            color: #15803d;
            background: #dcfce7;
            padding: 2px 8px;
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .map-link {
            font-size: 13px;
            text-decoration: none;
            margin-left: 6px;
        }

        .map-link:hover {
            opacity: 0.65;
        }

        .spot-num {
            background-color: #e2e8f0;
            color: #1e293b;
            font-size: 13px;
            font-weight: bold;
            width: 28px;
            height: 28px;
            line-height: 28px;
            border-radius: 50%;
            text-align: center;
            flex-shrink: 0;
        }

        .city-num {
            background-color: #3b82f6;
            color: white;
        }

        .north-num {
            background-color: #10b981;
            color: white;
        }

        .south-num {
            background-color: #f97316;
            color: white;
        }

        .irabu-num {
            background-color: #06b6d4;
            color: white;
        }

        .spot-desc {
            font-size: 13px;
            color: #d97706;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .spot-time {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: flex-start;
            gap: 6px;
        }

        .note {
            font-size: 12px;
            color: #ef4444;
            font-weight: 500;
        }

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            padding-left: 15px;
            border-left: 3px solid #20b2aa;
            margin-top: 10px;
        }

        .timeline-item {
            background: #ffffff;
            border: 1px solid var(--accent-border);
            border-radius: 8px;
            padding: 12px 16px;
            position: relative;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -23px;
            top: 16px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #008080;
            border: 2px solid white;
        }

        .timeline-drive {
            font-size: 12px;
            color: var(--text-muted);
            padding-left: 4px;
        }

        .timeline-tag {
            display: inline-block;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            margin-bottom: 4px;
        }

        .tag-flight {
            background-color: #e0f2fe;
            color: #0369a1;
        }

        .tag-hotel {
            background-color: #fef3c7;
            color: #b45309;
        }

        .tag-food {
            background-color: #fee2e2;
            color: #b91c1c;
        }

        .tag-shop {
            background-color: #f3e8ff;
            color: #6b21a8;
        }

        .tag-spot {
            background-color: #dcfce7;
            color: #15803d;
        }

        .tag-act {
            background-color: #ede9fe;
            color: #6d28d9;
        }

        .tag-backup {
            background-color: #f1f5f9;
            color: #475569;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .area-section {
                padding: 15px;
            }

            .grid-container {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 15px;
                margin-bottom: 15px;
            }

            .header h1 {
                font-size: 22px;
            }

            .tab-button {
                padding: 10px 18px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div id="app">

        <div class="header">
            <h1>宮古島景點美食與行程指南</h1>
            <p>分區區域地圖 ‧ 精確編號定位 ‧ 每日行程路線</p>
        </div>

        <div class="tab-container">
            <button v-for="tab in tabs" :key="tab.key" class="tab-button" :class="{active: activeTab === tab.key}"
                @click="activeTab = tab.key">{{ tab.label }}</button>
        </div>

        <!-- ==================== 分區美食景點 ==================== -->
        <div v-show="activeTab === 'spots'">
            <div class="area-section" v-for="area in areas" :key="area.key">
                <div class="area-title" :class="area.badgeClass">
                    <span>📍 {{ area.title }}</span>
                    <span style="font-size:13px;font-weight:normal">標號 {{ area.range }}</span>
                </div>

                <div class="map-placeholder">
                    <h3>🗺️ {{ area.title }}區域地圖（標號 {{ area.range }}）</h3>
                    <p>此處已預留圖片位置。<br><code>&lt;img src="{{ area.mapFile }}" alt="{{ area.title }}地圖" /&gt;</code></p>
                </div>

                <div class="grid-container">
                    <div class="spot-card" v-for="spot in area.spots" :key="spot.num">
                        <div>
                            <div class="spot-header">
                                <a class="spot-name" :href="searchUrl(spot.name)" target="_blank" rel="noopener"
                                    title="用 Google 搜尋">{{ spot.name }}</a>
                                <div class="spot-num" :class="area.numClass">{{ spot.num }}</div>
                            </div>
                            <div class="spot-desc">{{ spot.desc }}</div>
                            <span v-if="spot.scheduled" class="scheduled-badge">✅ 已排入行程</span>
                        </div>
                        <div class="spot-time">🕒 <span v-html="spot.time"></span></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== 8天7夜行程路線 ==================== -->
        <div v-show="activeTab === 'itinerary'">
            <div class="area-section" v-for="day in itinerary" :key="day.day">
                <div class="area-title area-day">
                    <span>{{ day.title }}</span>
                    <span style="font-size:13px;font-weight:normal">{{ day.hotel }}</span>
                </div>
                <div class="timeline">
                    <template v-for="(item, idx) in day.items" :key="idx">
                        <div class="timeline-item">
                            <span class="timeline-tag" :class="item.tagClass">{{ item.tag }}</span>
                            <strong>{{ item.name }}</strong>
                            <a class="map-link" :href="mapUrl(item.name)" target="_blank" rel="noopener"
                                title="在 Google 地圖開啟">🗺️</a>
                            <span v-if="item.note" class="note">{{ item.note }}</span>
                        </div>
                        <div class="timeline-drive" v-if="item.drive">{{ item.drive }}</div>
                    </template>
                </div>
            </div>
        </div>

    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
