<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌴 2026 宮古島海島渡假指南</title>
    <style>
        :root {
            --primary-color: #008080;
            --secondary-color: #20b2aa;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --accent-border: #e0e0e0;
            --badge-city: #2c3e50;
            --badge-north: #16a085;
            --badge-south: #d35400;
            --badge-irabu: #2980b9;
            --badge-kurima: #8e44ad;
            --badge-day: #008080;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #008080, #20b2aa);
            color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 128, 128, 0.2);
        }

        .header h1 {
            font-size: 26px;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        /* 第一層主分類 Tab */
        .main-tab-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .main-tab-button {
            padding: 12px 28px;
            font-size: 17px;
            font-weight: bold;
            border: 2px solid var(--primary-color);
            background-color: white;
            color: var(--primary-color);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .main-tab-button.active {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 10px rgba(0, 128, 128, 0.3);
        }

        /* 第二層子分類 Sub Tab */
        .sub-tab-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 25px;
            background: rgba(0, 128, 128, 0.05);
            padding: 10px;
            border-radius: 12px;
        }

        .sub-tab-button {
            padding: 6px 14px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--secondary-color);
            background-color: white;
            color: var(--primary-color);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sub-tab-button.active {
            background-color: var(--secondary-color);
            color: white;
        }

        .area-section {
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .area-title {
            font-size: 18px;
            font-weight: bold;
            padding: 10px 16px;
            border-radius: 8px;
            color: white;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .area-city {
            background-color: var(--badge-city);
        }

        .area-north {
            background-color: var(--badge-north);
        }

        .area-south {
            background-color: var(--badge-south);
        }

        .area-irabu {
            background-color: var(--badge-irabu);
        }

        .area-kurima {
            background-color: var(--badge-kurima);
        }

        .area-day {
            background-color: var(--badge-day);
        }

        .map-placeholder {
            padding: 20px;
            text-align: center;
            background: linear-gradient(180deg, #e0f2fe 0%, #f0f9ff 100%);
            border: 2px dashed #93c5fd;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .map-placeholder h3 {
            color: #1e3a8a;
            margin-bottom: 4px;
            font-size: 15px;
        }

        .map-placeholder p {
            color: #475569;
            font-size: 12px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }

        .spot-card {
            background: var(--card-bg);
            border: 1px solid var(--accent-border);
            border-radius: 10px;
            padding: 14px 16px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .spot-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.08);
        }

        .spot-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
            gap: 8px;
        }

        .spot-name {
            font-size: 15px;
            font-weight: bold;
            color: #2c3e50;
            text-decoration: none;
        }

        .spot-name:hover {
            color: var(--primary-color);
            text-decoration: underline;
        }

        .scheduled-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            color: #15803d;
            background: #dcfce7;
            padding: 2px 8px;
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .souvenir-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            color: #7c3aed;
            background: #f3e8ff;
            padding: 2px 8px;
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .map-link {
            font-size: 13px;
            text-decoration: none;
            margin-left: 6px;
        }

        .spot-num {
            background-color: #e2e8f0;
            color: #1e293b;
            font-size: 13px;
            font-weight: bold;
            width: 28px;
            height: 28px;
            line-height: 28px;
            border-radius: 50%;
            text-align: center;
            flex-shrink: 0;
        }

        .city-num {
            background-color: #3b82f6;
            color: white;
        }

        .north-num {
            background-color: #10b981;
            color: white;
        }

        .south-num {
            background-color: #f97316;
            color: white;
        }

        .irabu-num {
            background-color: #06b6d4;
            color: white;
        }

        .kurima-num {
            background-color: #8e44ad;
            color: white;
        }

        .spot-desc {
            font-size: 13px;
            color: #d97706;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .spot-time {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .note {
            font-size: 12px;
            color: #ef4444;
            font-weight: 500;
        }

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            padding-left: 15px;
            border-left: 3px solid #20b2aa;
            margin-top: 10px;
        }

        .timeline-item {
            background: #ffffff;
            border: 1px solid var(--accent-border);
            border-radius: 8px;
            padding: 12px 16px;
            position: relative;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -23px;
            top: 16px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #008080;
            border: 2px solid white;
        }

        .timeline-drive {
            font-size: 12px;
            color: var(--text-muted);
            padding-left: 4px;
        }

        .timeline-tag {
            display: inline-block;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            margin-bottom: 4px;
            margin-right: 6px;
        }

        .tag-flight {
            background-color: #e0f2fe;
            color: #0369a1;
        }

        .tag-hotel {
            background-color: #fef3c7;
            color: #b45309;
        }

        .tag-food {
            background-color: #fee2e2;
            color: #b91c1c;
        }

        .tag-shop {
            background-color: #f3e8ff;
            color: #6b21a8;
        }

        .tag-spot {
            background-color: #dcfce7;
            color: #15803d;
        }

        .tag-act {
            background-color: #ede9fe;
            color: #6d28d9;
        }

        .tag-backup {
            background-color: #f1f5f9;
            color: #475569;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .area-section {
                padding: 15px;
            }

            .grid-container {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 15px;
                margin-bottom: 15px;
            }

            .header h1 {
                font-size: 20px;
            }

            .main-tab-button {
                padding: 8px 16px;
                font-size: 14px;
            }

            .sub-tab-button {
                padding: 5px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <div id="app">

        <!-- 頂部標題區 -->
        <div class="header">
            <h1>🌴 2026 宮古島海島渡假指南</h1>
            <p>景點美食地圖 ‧ 伴手禮購物 ‧ 每日行程規劃</p>
        </div>

        <!-- 分類一 / 分類二：主要 Tab 選擇器 -->
        <div class="main-tab-container">
            <button class="main-tab-button" :class="{active: mainTab === 'spots'}" @click="mainTab = 'spots'">
                📍 景點美食與伴手禮
            </button>
            <button class="main-tab-button" :class="{active: mainTab === 'itinerary'}" @click="mainTab = 'itinerary'">
                🗓️ 每日行程總覽
            </button>
        </div>

        <!-- ==================== 分類一：景點美食與伴手禮 ==================== -->
        <div v-show="mainTab === 'spots'">
            <!-- 子 Tab：區域/伴手禮過濾 -->
            <div class="sub-tab-container">
                <button class="sub-tab-button" :class="{active: spotSubTab === 'all'}" @click="spotSubTab = 'all'">
                    全部區域
                </button>
                <button v-for="area in areaList" :key="area.key" class="sub-tab-button"
                    :class="{active: spotSubTab === area.key}" @click="spotSubTab = area.key">
                    {{ area.shortTitle || area.title }}
                </button>
                <button class="sub-tab-button" :class="{active: spotSubTab === 'souvenir'}"
                    @click="spotSubTab = 'souvenir'">
                    🛍️ 伴手禮名店
                </button>
            </div>

            <!-- 景點與美食區域列表 -->
            <div class="area-section" v-for="area in filteredAreas" :key="area.key">
                <div class="area-title" :class="area.badgeClass">
                    <span>📍 {{ area.title }}</span>
                    <span v-if="area.range" style="font-size:13px;font-weight:normal">標號 {{ area.range }}</span>
                </div>

                <div class="map-placeholder" v-if="area.mapFile">
                    <h3>🗺️ {{ area.title }}區域地圖（標號 {{ area.range }}）</h3>
                    <p><code>&lt;img src="{{ area.mapFile }}" alt="{{ area.title }}地圖" /&gt;</code></p>
                </div>

                <div class="grid-container">
                    <div class="spot-card" v-for="spot in getSpotsByArea(area.key)" :key="spot.id || spot.name">
                        <div>
                            <div class="spot-header">
                                <a class="spot-name" :href="searchUrl(spot.name)" target="_blank" rel="noopener"
                                    title="用 Google 搜尋">{{ spot.name }}</a>
                                <div class="spot-num" :class="area.numClass" v-if="spot.id">{{ spot.id }}</div>
                            </div>
                            <div class="spot-desc">{{ spot.desc }}</div>
                            <span v-if="spot.id && isScheduled(spot.id)" class="scheduled-badge">✅ 已排入行程</span>
                            <span v-if="spot.isSouvenir" class="souvenir-badge">🎁 伴手禮推薦</span>
                        </div>
                        <div class="spot-time">🕒 <span v-html="spot.time || '依店家公告'"></span></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== 分類二：行程總覽 ==================== -->
        <div v-show="mainTab === 'itinerary'">
            <!-- 子 Tab：每天行程選擇 -->
            <div class="sub-tab-container">
                <button class="sub-tab-button" :class="{active: itinerarySubTab === 'all'}"
                    @click="itinerarySubTab = 'all'">
                    顯示全部天數
                </button>
                <button v-for="day in rawItinerary" :key="day.day" class="sub-tab-button"
                    :class="{active: itinerarySubTab === day.day}" @click="itinerarySubTab = day.day">
                    Day {{ day.day }} ({{ day.dateStr }})
                </button>
            </div>

            <!-- 行程路線 -->
            <div class="area-section" v-for="day in filteredItinerary" :key="day.day">
                <div class="area-title area-day">
                    <span>{{ day.title }}</span>
                    <span style="font-size:13px;font-weight:normal">{{ day.hotel }}</span>
                </div>
                <div class="timeline">
                    <template v-for="(item, idx) in day.items" :key="idx">
                        <div class="timeline-item">
                            <span class="timeline-tag" :class="getTagClass(item.type)">{{ getTypeName(item.type)
                                }}</span>
                            <strong>{{ item.name }}</strong>
                            <a class="map-link" :href="mapUrl(item.name)" target="_blank" rel="noopener"
                                title="在 Google 地圖開啟">🗺️</a>

                            <div class="spot-time" v-if="item.time">
                                🕒 營業時間：<span v-html="item.time"></span>
                            </div>

                            <div v-if="item.note" class="note" style="margin-top: 4px;">📌 {{ item.note }}</div>
                        </div>
                        <div class="timeline-drive" v-if="item.drive">{{ item.drive }}</div>
                    </template>
                </div>
            </div>
        </div>

    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

            mounted() {
                // 自動判斷今日日期，如果落在行程內則預設切換到該天 Tab
                const todayStr = new Date().toISOString().split('T')[0];
                const matchedDay = this.rawItinerary.find(d => d.date === todayStr);
                if (matchedDay) {
                    this.itinerarySubTab = matchedDay.day;
                }
            },
            methods: {
                searchUrl(name) {
                    return 'https://www.google.com/search?q=' + encodeURIComponent(name);
                },
                mapUrl(name) {
                    return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(name);
                },
                getSpotsByArea(areaKey) {
                    if (this.spotSubTab === 'souvenir') {
                        return this.places.filter(p => p.areaKey === areaKey && p.isSouvenir);
                    }
                    return this.places.filter(p => p.areaKey === areaKey);
                },
                isScheduled(placeId) {
                    return this.scheduledIds.has(placeId);
                },
                getTypeName(type) {
                    const typeMap = {
                        flight: '交通',
                        hotel: '飯店',
                        food: '美食',
                        shop: '購物',
                        spot: '景點',
                        act: '行程',
                        backup: '備案'
                    };
                    return typeMap[type] || '其他';
                },
                getTagClass(type) {
                    return `tag-${type}`;
                }
            },
            computed: {
                // 依據子選單選擇過濾要顯示的區域
                filteredAreas() {
                    if (this.spotSubTab === 'all') {
                        return this.areaList;
                    }
                    if (this.spotSubTab === 'souvenir') {
                        // 只顯示有伴手禮店的區域
                        const souvenirAreaKeys = new Set(this.places.filter(p => p.isSouvenir).map(p => p.areaKey));
                        return this.areaList.filter(a => souvenirAreaKeys.has(a.key));
                    }
                    return this.areaList.filter(a => a.key === this.spotSubTab);
                },

                // 依據子選單選擇過濾要顯示的行程天數
                filteredItinerary() {
                    if (this.itinerarySubTab === 'all') {
                        return this.formattedItinerary;
                    }
                    return this.formattedItinerary.filter(d => d.day === this.itinerarySubTab);
                },

                // 自動搜集已排入行程的景點 ID 集合
                scheduledIds() {
                    const ids = new Set();
                    this.rawItinerary.forEach(day => {
                        day.items.forEach(item => {
                            if (item.id) ids.add(item.id);
                        });
                    });
                    return ids;
                },

                // 格式化行程，將 ID 自動轉換對應地點的詳細資料
                formattedItinerary() {
                    return this.rawItinerary.map(day => {
                        const items = day.items.map(item => {
                            if (item.id) {
                                const place = this.places.find(p => p.id === item.id);
                                if (place) {
                                    return {
                                        ...item,
                                        name: place.name,
                                        time: place.time,
                                        type: item.type || place.type
                                    };
                                }
                            }
                            return item;
                        });
                        return { ...day, items };
                    });
                }
            }
        }).mount('#app');
